[package]
name = "utility-desktop"
version = "0.5.2"
description = "Local-first desktop utility toolbox"
authors = ["Emmerson Mena"]
edition = "2021"
license = "MIT"

[lib]
name = "utility_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
image-webp = "0.2"
libwebp-sys2 = "0.2"
oxipng = { version = "10", default-features = false }
rayon = "1"
thiserror = "2"
pdf-inspector = "=1.14.2"
resvg = "0.48"
fontdb = "0.24"
kmeans_colors = { version = "0.7", default-features = false, features = ["palette_color"] }
palette = "0.7"
base64 = "0.22"

[dev-dependencies]
lopdf = "0.42"
